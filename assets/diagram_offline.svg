<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 300" width="1150" height="300" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Offline indexing">
  <title>Offline indexing</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5B6475"/>
    </marker>
  </defs>
  <rect width="1150" height="300" fill="#FFFFFF"/>
  <g>
    <rect x="20" y="100" width="190" height="100" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="115.0" y="136.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Catalog CSV</text>
    <text x="115.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5B6475">5k items, mixed</text>
    <text x="115.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#5B6475">food and non-food</text>
  </g>
  <g>
    <rect x="260" y="100" width="210" height="100" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="365.0" y="136.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Parse + clean</text>
    <text x="365.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5B6475">JSON fields, dedupe</text>
    <text x="365.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#5B6475">4,997 items</text>
  </g>
  <g>
    <rect x="520" y="95" width="250" height="110" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="645.0" y="136.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Item doc text</text>
    <text x="645.0" y="159.0" text-anchor="middle" font-size="13.5" fill="#5B6475">name, category, description,</text>
    <text x="645.0" y="178.0" text-anchor="middle" font-size="13.5" fill="#5B6475">attributes, price bucket</text>
  </g>
  <g>
    <rect x="870" y="24.0" width="260" height="72" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="1000.0" y="55.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Embeddings</text>
    <text x="1000.0" y="78.5" text-anchor="middle" font-size="13.5" fill="#5B6475">text-embedding-3-large</text>
  </g>
  <g>
    <rect x="870" y="114.0" width="260" height="72" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="1000.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">BM25 index</text>
    <text x="1000.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">PT stemming, accent folding</text>
  </g>
  <g>
    <rect x="870" y="204.0" width="260" height="72" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="1000.0" y="235.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Food / non-food flag</text>
    <text x="1000.0" y="258.5" text-anchor="middle" font-size="13.5" fill="#5B6475">from the item category</text>
  </g>
  <path d="M 210 150 H 260" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 470 150 H 520" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 770 150 H 870" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 820 150 V 60 H 870" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 820 150 V 240 H 870" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
