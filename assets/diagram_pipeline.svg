<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1610 560" width="1610" height="560" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Hybrid search pipeline (S8)">
  <title>Hybrid search pipeline (S8)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5B6475"/>
    </marker>
  </defs>
  <rect width="1610" height="560" fill="#FFFFFF"/>
  <rect x="20" y="23" width="14" height="14" rx="3" fill="#0332AF" stroke="#0332AF" stroke-width="1.5"/>
  <text x="42" y="34" text-anchor="start" font-size="13" font-weight="400" fill="#5B6475">LLM call (gpt-4.1-mini)</text>
  <rect x="230" y="23" width="14" height="14" rx="3" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
  <text x="252" y="34" text-anchor="start" font-size="13" font-weight="400" fill="#5B6475">retrieval and scoring</text>
  <g>
    <rect x="20" y="225" width="150" height="90" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="95.0" y="265.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">User query</text>
    <text x="95.0" y="288.6" text-anchor="middle" font-size="13.5" fill="#5B6475">Portuguese, free text</text>
  </g>
  <g>
    <rect x="220" y="215" width="200" height="110" rx="10" fill="#0332AF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="320.0" y="256.1" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Query understanding</text>
    <text x="320.0" y="279.1" text-anchor="middle" font-size="13.5" fill="#E9EEFC">intent + dish list</text>
    <text x="320.0" y="298.1" text-anchor="middle" font-size="13.5" fill="#E9EEFC">JSON output</text>
  </g>
  <g>
    <rect x="490" y="95.0" width="230" height="90" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="605.0" y="126.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Dense, raw query</text>
    <text x="605.0" y="149.0" text-anchor="middle" font-size="13.5" fill="#5B6475">text-embedding-3-large</text>
    <text x="605.0" y="168.0" text-anchor="middle" font-size="13.5" fill="#5B6475">top-100, weight 1</text>
  </g>
  <g>
    <rect x="490" y="225.0" width="230" height="90" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="605.0" y="256.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Dense, expanded</text>
    <text x="605.0" y="279.1" text-anchor="middle" font-size="13.5" fill="#5B6475">query + dish list</text>
    <text x="605.0" y="298.1" text-anchor="middle" font-size="13.5" fill="#5B6475">top-100, weight 1</text>
  </g>
  <g>
    <rect x="490" y="355.0" width="230" height="90" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="605.0" y="386.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">BM25, expanded</text>
    <text x="605.0" y="409.1" text-anchor="middle" font-size="13.5" fill="#5B6475">non-zero hits only</text>
    <text x="605.0" y="428.1" text-anchor="middle" font-size="13.5" fill="#5B6475">top-100, weight 0.5</text>
  </g>
  <g>
    <rect x="790" y="215" width="170" height="110" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="875.0" y="256.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Weighted RRF</text>
    <text x="875.0" y="279.1" text-anchor="middle" font-size="13.5" fill="#5B6475">k = 60</text>
    <text x="875.0" y="298.1" text-anchor="middle" font-size="13.5" fill="#5B6475">3 ranked lists</text>
  </g>
  <g>
    <rect x="1010" y="215" width="180" height="110" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="1100.0" y="256.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Food prior</text>
    <text x="1100.0" y="279.1" text-anchor="middle" font-size="13.5" fill="#5B6475">non-food score × 0.5</text>
    <text x="1100.0" y="298.1" text-anchor="middle" font-size="13.5" fill="#5B6475">off for product intent</text>
  </g>
  <g>
    <rect x="1240" y="215" width="190" height="110" rx="10" fill="#0332AF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="1335.0" y="256.1" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">Listwise rerank</text>
    <text x="1335.0" y="279.1" text-anchor="middle" font-size="13.5" fill="#E9EEFC">top 30 in one call</text>
    <text x="1335.0" y="298.1" text-anchor="middle" font-size="13.5" fill="#E9EEFC">returns the order</text>
  </g>
  <g>
    <rect x="1480" y="225" width="110" height="90" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="1535.0" y="265.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">Top 10</text>
    <text x="1535.0" y="288.6" text-anchor="middle" font-size="13.5" fill="#5B6475">results</text>
  </g>
  <path d="M 170 270 H 220" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 95 225 V 140 H 490" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 420 270 H 490" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 380 325 V 400 H 490" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 720 140 H 755 V 245 H 790" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 720 270 H 790" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 720 400 H 755 V 295 H 790" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 960 270 H 1010" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1190 270 H 1240" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 1430 270 H 1480" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 260 325 V 490 H 1100 V 325" fill="none" stroke="#5B6475" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="680" y="482" text-anchor="middle" font-size="13" font-weight="400" fill="#5B6475">intent (dish, occasion, grocery or product)</text>
  <text x="1590" y="545" text-anchor="end" font-size="13" font-weight="400" fill="#5B6475">2 LLM calls per query  ·  $0.14 per 100 queries  ·  p50 2.4 s</text>
</svg>
