<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" font-family="Inter, Helvetica, Arial, sans-serif" role="img" aria-label="Code and data flow">
  <title>Code and data flow</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#5B6475"/>
    </marker>
  </defs>
  <rect width="1500" height="500" fill="#FFFFFF"/>
  <g>
    <rect x="20" y="110" width="160" height="80" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="100.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">data/</text>
    <text x="100.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">catalog + queries CSV</text>
  </g>
  <g>
    <rect x="270" y="110" width="160" height="80" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="350.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">items.parquet</text>
    <text x="350.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">clean, item doc text</text>
  </g>
  <g>
    <rect x="520" y="110" width="160" height="80" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="600.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">runs/</text>
    <text x="600.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">one run per system</text>
  </g>
  <g>
    <rect x="770" y="110" width="160" height="80" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="850.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">pool.json</text>
    <text x="850.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">4,228 pairs</text>
  </g>
  <g>
    <rect x="1020" y="110" width="160" height="80" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="1100.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">qrels.json</text>
    <text x="1100.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">frozen judge grades</text>
  </g>
  <g>
    <rect x="1270" y="110" width="210" height="80" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="1375.0" y="145.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">reports/ + assets/</text>
    <text x="1375.0" y="168.5" text-anchor="middle" font-size="13.5" fill="#5B6475">tables, plots</text>
  </g>
  <path d="M 180 150.0 H 270" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="225.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0332AF">index</text>
  <path d="M 430 150.0 H 520" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="475.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0332AF">run</text>
  <path d="M 680 150.0 H 770" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="725.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0332AF">pool</text>
  <path d="M 930 150.0 H 1020" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="975.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0332AF">judge</text>
  <path d="M 1180 150.0 H 1270" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="1225.0" y="140.0" text-anchor="middle" font-size="13" font-weight="600" fill="#0332AF">eval, report</text>
  <g>
    <rect x="500" y="10" width="200" height="56" rx="10" fill="#FFFFFF" stroke="#0332AF" stroke-width="1.5"/>
    <text x="600.0" y="33.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">final_top10.csv</text>
    <text x="600.0" y="56.5" text-anchor="middle" font-size="13.5" fill="#5B6475">results/</text>
  </g>
  <path d="M 600 110 V 66" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="612" y="94" text-anchor="start" font-size="13" font-weight="600" fill="#0332AF">export</text>
  <g>
    <rect x="470" y="290" width="260" height="90" rx="10" fill="#F5F7FA" stroke="#C9D0DC" stroke-width="1.5"/>
    <text x="600.0" y="321.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0B0F1A">systems.yaml</text>
    <text x="600.0" y="344.1" text-anchor="middle" font-size="13.5" fill="#5B6475">REGISTRY: bm25, dense, pipeline</text>
    <text x="600.0" y="363.1" text-anchor="middle" font-size="13.5" fill="#5B6475">retrievers, query, rerank</text>
  </g>
  <path d="M 600 290 V 190" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g>
    <rect x="970" y="290" width="260" height="90" rx="10" fill="#E9EEFC" stroke="#0332AF" stroke-width="1.5"/>
    <text x="1100.0" y="321.1" text-anchor="middle" font-size="17" font-weight="600" fill="#0332AF">Human check</text>
    <text x="1100.0" y="344.1" text-anchor="middle" font-size="13.5" fill="#0B0F1A">300 labels, κ gate</text>
    <text x="1100.0" y="363.1" text-anchor="middle" font-size="13.5" fill="#0B0F1A">eval_freeze.json</text>
  </g>
  <path d="M 1100 290 V 190" fill="none" stroke="#5B6475" stroke-width="1.8" marker-end="url(#arrow)"/>
  <g>
    <rect x="20" y="420" width="1460" height="60" rx="10" fill="#E9EEFC" stroke="#0332AF" stroke-width="1.5"/>
    <text x="750.0" y="445.6" text-anchor="middle" font-size="17" font-weight="600" fill="#0332AF">llm.LLMClient: every LLM and embedding call</text>
    <text x="750.0" y="468.6" text-anchor="middle" font-size="13.5" fill="#0B0F1A">disk cache keyed by (model, prompt hash), temperature 0, cost log per call</text>
  </g>
</svg>
