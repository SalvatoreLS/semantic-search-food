<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoodSearch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="fs.css">
<link rel="stylesheet" href="app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="fs" id="fs-root" data-theme="light">
<header class="fs-top">
<div class="fs-brand"><span class="fs-word">FoodSearch</span><span class="fs-tag">semantic search · research demo</span></div>
<div style="display: flex; align-items: center; gap: 12px">
<nav class="fs-nav" aria-label="Views">
<a href="#search" data-view="search">Search</a>
<a href="#compare" data-view="compare">Compare</a>
<a href="#label" data-view="label">Label</a>
<a href="#about" data-view="about">About</a>
</nav>
<button class="fs-iconbtn" id="fs-theme" aria-label="Toggle light or dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></button>
</div>
</header>
<main class="fs-page fs-view" id="view-search" data-view="search" hidden></main>
<main class="fs-page fs-view" id="view-compare" data-view="compare" hidden></main>
<main class="fs-page fs-view" id="view-label" data-view="label" hidden></main>
<main class="fs-page fs-view" id="view-about" data-view="about" hidden></main>
<div id="fs-drawer-host"></div>
</div>
</body>
</html>
