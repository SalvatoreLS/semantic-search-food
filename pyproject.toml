[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foodsearch"
version = "0.1.0"
description = "Semantic search over a Portuguese food-delivery catalog, with an LLM-judged evaluation that needs no ground truth."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pyarrow>=16",
    "pyyaml>=6.0,<7",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "openai>=2.0,<4",
    "diskcache>=5.6,<6",
    "nltk>=3.9,<4",
    "unidecode>=1.3,<2",
    "bm25s>=0.2.6,<0.4",
    "torch>=2.4,<3",
    "sentence-transformers>=3.0,<7",
    "ranx>=0.3.20,<0.4",
    "matplotlib>=3.8,<4",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "ipykernel>=6.29",
    "pillow>=10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foodsearch = ["web/static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
